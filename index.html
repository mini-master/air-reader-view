<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensor Data</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: black;
            color: white;
        }

        #chartContainer {
            width: 90vw;
            height: 80vh;
            margin: auto;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            background-color: black;
        }

        #info {
            text-align: center;
            margin: 10px;
            font-size: 1.2rem;
        }

        #error {
            text-align: center;
            padding: 1rem;
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div id="error"></div>
    <div id="info">
        🌬️ 1-Hour Average Air Quality: <span id="avgAir">--</span>
    </div>

    <div id="chartContainer">
        <canvas id="sensorChart"></canvas>
    </div>

    <script>
        function getApiKeyFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('api_key');
        }

        const apiKey = getApiKeyFromUrl();

        if (!apiKey) {
            const errorMsg = '❌ API key missing. Add ?api_key=YOUR_KEY';
            document.getElementById('error').textContent = errorMsg;
            throw new Error(errorMsg);
        }

        const ctx = document.getElementById('sensorChart').getContext('2d');

        const labels = [];
        const temperatureData = [];
        const humidityData = [];
        const airQualityData = [];
        const airQualityAvgData = [];

        const sensorChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Temperature (°C)',
                        borderColor: 'red',
                        backgroundColor: 'red',
                        data: temperatureData,
                        fill: false
                    },
                    {
                        label: 'Humidity (%)',
                        borderColor: 'blue',
                        backgroundColor: 'blue',
                        data: humidityData,
                        fill: false
                    },
                    {
                        label: 'Air Quality Index',
                        borderColor: 'green',
                        backgroundColor: 'green',
                        data: airQualityData,
                        fill: false
                    },
                    {
                        label: 'Air Quality (1h Avg)',
                        borderColor: 'yellow',
                        backgroundColor: 'yellow',
                        borderDash: [5, 5],
                        data: airQualityAvgData,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        ticks: { color: 'white' },
                        grid: { color: 'white' }
                    },
                    y: {
                        ticks: { color: 'white' },
                        grid: { color: 'white' }
                    }
                },
                plugins: {
                    legend: {
                        labels: { color: 'white' }
                    }
                }
            }
        });

        function fetchData() {
            fetch(`https://api.thingspeak.com/channels/2853926/feeds.json?api_key=${apiKey}&results=60`)
                .then(response => response.json())
                .then(data => {

                    labels.length = 0;
                    temperatureData.length = 0;
                    humidityData.length = 0;
                    airQualityData.length = 0;
                    airQualityAvgData.length = 0;

                    let sumAir = 0;
                    let count = 0;

                    data.feeds.forEach(entry => {
                        labels.push(new Date(entry.created_at).toLocaleTimeString());

                        temperatureData.push(Number(entry.field1));
                        humidityData.push(Number(entry.field2));

                        const aq = Number(entry.field3);
                        airQualityData.push(aq);

                        if (!isNaN(aq)) {
                            sumAir += aq;
                            count++;
                        }
                    });

                    const avgAir = count > 0 ? (sumAir / count).toFixed(1) : '--';
                    document.getElementById('avgAir').textContent = avgAir;

                    // Draw flat average line
                    for (let i = 0; i < airQualityData.length; i++) {
                        airQualityAvgData.push(avgAir);
                    }

                    sensorChart.update();
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById('error').textContent =
                        '❌ Failed to fetch data from ThingSpeak';
                });
        }

        fetchData();
        setInterval(fetchData, 60000); // every 60 seconds
    </script>

</body>
</html>
